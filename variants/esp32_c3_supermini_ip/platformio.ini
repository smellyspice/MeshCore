; ----------- ESP32-C3 "Super Mini" (no LoRa radio, IP-bridge room server) ------------
;
; Same role as variants/esp32_s3_zero_ip: reaches a MeshCore repeater's IpBridge server
; (WITH_IP_BRIDGE) directly over WiFi/IP -- TCP + TLS-PSK -- using
; helpers/esp32/IpBridgeRadio.cpp in place of a LoRa radio driver, instead of needing an
; ESP-NOW hop through a bridging repeater/hub (see the sibling esp32_c3_supermini
; variant's ESPNOW_BRIDGE_RADIO envs for that alternative).
;
; wifi.ssid/wifi.pwd/ip.host/ip.port/ip.secret are runtime-only, set via the CLI (this
; role has a real text CLI, unlike the companion) -- see examples/simple_room_server's
; own IP_BRIDGE_RADIO block and src/helpers/CommonCLI.cpp. There is no compile-time
; default for any of the five -- an unconfigured board stays fully inert (no socket, no
; traffic).
;
; Chip-generic: target.h/target.cpp here are copied unmodified from esp32_s3_zero_ip's
; (IpBridgeRadio.cpp/target.cpp are chip-agnostic Arduino-ESP32 code, nothing S3-specific
; in them), same reasoning esp32_c3_supermini's own header comment already gives for its
; ESPNowBridgeRadio equivalent. Same "no onboard LED pin confirmed yet" caveat as that
; variant -- deliberately left undefined here too.

[ESP32_C3_SuperMini_IP]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32_c3_supermini_ip
  ; Same reasoning as esp32_s3_zero_ip's identical flag (see that variant's
  ; comment) -- 80MHz is Espressif's documented WiFi-stable floor, and the
  ; C3's max is 160MHz, so this is the one supported step down, tried here
  ; to cut heat/current draw on this always-on bridge board.
  -D ESP32_CPU_FREQ=80
  ; Same rationale as esp32_c3_supermini's own identical flags -- see that
  ; variant's header comment for the "confirmed live" detail.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D PIN_USER_BTN=0
  -D P_LORA_DIO_1=-1
  -D P_LORA_NSS=-1
  -D IP_BRIDGE_RADIO=1
  ; Same stack-overflow rationale as esp32_s3_zero_ip's identical flag: WiFi STA +
  ; mbedtls TLS + SPIFFS + the room-server CLI together need more than the default
  ; 8KB main task stack.
  -D ARDUINO_LOOP_STACK_SIZE=16384
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE --> -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/esp32/IpBridgeRadio.cpp>
  +<../variants/esp32_c3_supermini_ip>

; No-LoRa room server, IP-bridge sidecar to a repeater over WiFi (TCP + TLS-PSK) --
; same connectivity model as esp32_s3_zero_ip's own room_server_ip env, just on the
; cheaper C3 chip. Real text CLI over USB.
[env:ESP32_C3_SuperMini_room_server_ip]
extends = ESP32_C3_SuperMini_IP
build_flags =
  ${ESP32_C3_SuperMini_IP.build_flags}
  -D ADVERT_NAME='"IP Room Server"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D WITH_IP_BRIDGE=1
  -D WITH_ROOM_CHANNEL_BRIDGE=1
; NOTE: DO NOT ENABLE --> -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE --> -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE --> -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
build_src_filter = ${ESP32_C3_SuperMini_IP.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
lib_deps =
  ${ESP32_C3_SuperMini_IP.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Diagnostic-only build: room server has a plain text CLI, so debug logging
; doesn't collide with anything -- same reasoning as the ESP-NOW room
; server's own _debug env.
[env:ESP32_C3_SuperMini_room_server_ip_debug]
extends = env:ESP32_C3_SuperMini_room_server_ip
build_flags =
  ${env:ESP32_C3_SuperMini_room_server_ip.build_flags}
  -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
build_src_filter = ${env:ESP32_C3_SuperMini_room_server_ip.build_src_filter}
