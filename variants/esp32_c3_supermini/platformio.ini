; ----------- ESP32-C3 "Super Mini" (no LoRa radio, ESP-NOW bridge companion) ------------
;
; Same role as variants/esp32_s3_zero: joins an existing MeshCore repeater's ESPNowBridge
; network (WITH_ESPNOW_BRIDGE) directly, using helpers/esp32/ESPNowBridgeRadio.cpp in place
; of a LoRa radio driver. The repeater's firmware is unmodified -- 'bridge.channel'/
; 'bridge.secret' must be set via the CLI to match its own settings exactly
; ('set bridge.channel <1-14>' / 'set bridge.secret <key>'). There is no compile-time
; channel/secret default -- an unconfigured board stays inert (no ESP-NOW peer registered)
; until both are set.
;
; SPECULATIVE / UNTESTED as of writing -- no physical board in hand yet. Everything here is
; either (a) generic to the ESP32-C3 chip itself (RAM/flash/PlatformIO board id), or
; (b) copied unmodified from variants/esp32_s3_zero, since ESPNowBridgeRadio.cpp/target.cpp
; are chip-agnostic Arduino-ESP32 code with nothing S3-specific in them. The one real unknown
; is the onboard LED pin/type on this specific unbranded board -- deliberately left undefined
; below rather than guessed; add P_LORA_TX_LED=<pin> (plain GPIO LED) once confirmed, since
; these clone boards commonly use a plain LED here, not a WS2812 like the S3-Zero.
;
; "esp32-c3-devkitm-1" is PlatformIO's generic C3 board id -- there's no distinct board JSON
; for "Super Mini" specifically, same fallback already used by variants/generic_espnow,
; variants/heltec_ct62, and variants/tenstar_c3 in this repo.

[ESP32_C3_SuperMini]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32_c3_supermini
  ; Unlike esp32_s3_zero's board JSON, "esp32-c3-devkitm-1" doesn't define these,
  ; so Serial defaults to UART0's physical pins instead of the native USB-Serial/JTAG
  ; port -- the CLI would be silent on the same port esptool flashes over. Confirmed
  ; live: without this, a freshly-flashed board answers esptool fine but never
  ; responds to any CLI command over USB.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  ; BOOT button, GPIO0 -- universal strapping-pin convention across the whole ESP32
  ; family (same as esp32_s3_zero), not board-specific.
  -D PIN_USER_BTN=0
  -D P_LORA_DIO_1=-1
  -D P_LORA_NSS=-1
  -D ESPNOW_BRIDGE_RADIO=1
  ; Same stack-overflow rationale as esp32_s3_zero's identical flag: WiFi/ESP-NOW +
  ; BLE + SPIFFS + the companion protocol together exceed the default 8KB loop stack.
  -D ARDUINO_LOOP_STACK_SIZE=16384
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/esp32/ESPNowBridgeRadio.cpp>
  +<../variants/esp32_c3_supermini>

[env:ESP32_C3_SuperMini_comp_radio_bridge_espnow]
extends = ESP32_C3_SuperMini
build_flags =
  ${ESP32_C3_SuperMini.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${ESP32_C3_SuperMini.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_C3_SuperMini.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32_C3_SuperMini_comp_radio_bridge_espnow_ble]
extends = ESP32_C3_SuperMini
build_flags =
  ${ESP32_C3_SuperMini.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${ESP32_C3_SuperMini.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_C3_SuperMini.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32_C3_SuperMini_comp_radio_bridge_espnow_dual]
extends = ESP32_C3_SuperMini
build_flags =
  ${ESP32_C3_SuperMini.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
  -D BLE_PIN_CODE=123456
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${ESP32_C3_SuperMini.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_C3_SuperMini.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:ESP32_C3_SuperMini_comp_radio_bridge_espnow_debug]
extends = env:ESP32_C3_SuperMini_comp_radio_bridge_espnow
build_flags =
  ${env:ESP32_C3_SuperMini_comp_radio_bridge_espnow.build_flags}
  -D BLE_PIN_CODE=123456
  -D ESPNOW_DEBUG_LOGGING=1
  -D MESH_DEBUG=1
build_src_filter = ${env:ESP32_C3_SuperMini_comp_radio_bridge_espnow.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>

; Joins the same ESPNowBridge network as the companion envs above, but as a
; simple_room_server instead of a companion. Includes the single-channel
; public-channel-to-post-feed bridge (WITH_ROOM_CHANNEL_BRIDGE) -- see
; planning/room-server-channel-bridge.md for the full design writeup.
[env:ESP32_C3_SuperMini_room_server_bridge_espnow]
extends = ESP32_C3_SuperMini
build_flags =
  ${ESP32_C3_SuperMini.build_flags}
  -D ADVERT_NAME='"ESPNOW Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D WITH_ROOM_CHANNEL_BRIDGE=1
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${ESP32_C3_SuperMini.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
lib_deps =
  ${ESP32_C3_SuperMini.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Diagnostic-only build: room server has a plain text CLI, not a shared
; binary-protocol line like the companion, so debug logging doesn't collide
; with anything here.
[env:ESP32_C3_SuperMini_room_server_bridge_espnow_debug]
extends = env:ESP32_C3_SuperMini_room_server_bridge_espnow
build_flags =
  ${env:ESP32_C3_SuperMini_room_server_bridge_espnow.build_flags}
  -D ESPNOW_DEBUG_LOGGING=1
  -D MESH_DEBUG=1
  -D BRIDGE_DEBUG=1

; Joins the same ESPNowBridge network as the companion envs above, but as a
; full simple_repeater instead of a companion.
[env:ESP32_C3_SuperMini_repeater_bridge_espnow]
extends = ESP32_C3_SuperMini
build_flags =
  ${ESP32_C3_SuperMini.build_flags}
  -D ADVERT_NAME='"ESPNOW Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_IP_BRIDGE=1
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D BRIDGE_DEBUG=1
build_src_filter = ${ESP32_C3_SuperMini.build_src_filter}
  +<helpers/bridges/IpBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${ESP32_C3_SuperMini.lib_deps}
  ${esp32_ota.lib_deps}
