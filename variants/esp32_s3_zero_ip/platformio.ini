; ----------- Waveshare ESP32-S3-Zero (no LoRa radio, IP-bridge companion) ------------
;
; Reaches a MeshCore repeater's IpBridge server (WITH_IP_BRIDGE) directly over WiFi/IP
; -- TCP + TLS-PSK -- using helpers/esp32/IpBridgeRadio.cpp in place of a LoRa radio
; driver, instead of needing an ESP-NOW hop through a bridging repeater/hub (see the
; sibling esp32_s3_zero variant's ESPNOW_BRIDGE_RADIO envs for that alternative).
;
; wifi.ssid/wifi.pwd/ip.host/ip.port/ip.secret are runtime-only, set via the binary
; companion protocol (CMD_SET_WIFI_PARAMS/CMD_SET_IP_PARAMS -- see
; examples/companion_radio/MyMesh.cpp and tools/set_ip_params.py), since companion
; firmware has no text CLI. The target repeater's IpBridge server needs a matching
; 'ip.peer.add <this device's identity> <secret>' entry -- see IpBridge's own doc
; comment for the per-identity credential model. There is no compile-time default for
; any of the five -- an unconfigured board stays fully inert (no socket, no traffic).

[ESP32_S3_Zero_IP]
extends = esp32_base
board = esp32-s3-zero
board_build.partitions = huge_app.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32_s3_zero_ip
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D PIN_USER_BTN=0
  -D P_LORA_DIO_1=-1
  -D P_LORA_NSS=-1
  ; onboard WS2812 RGB LED (per https://docs.waveshare.com/ESP32-S3-Zero), reused for
  ; IpBridgeRadio's connect/ping/pong status indicators -- see IpBridgeRadio.cpp.
  -D P_LORA_TX_NEOPIXEL_LED=21
  -D IP_BRIDGE_RADIO=1
  ; same reasoning as esp32_s3_zero's own ARDUINO_LOOP_STACK_SIZE bump --
  ; WiFi STA + mbedtls TLS + BLE + SPIFFS + the companion protocol together
  ; need more than the default 8KB main task stack.
  -D ARDUINO_LOOP_STACK_SIZE=16384
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE --> -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/esp32/IpBridgeRadio.cpp>
  +<../variants/esp32_s3_zero_ip>

[env:ESP32_S3_Zero_comp_radio_ip]
extends = ESP32_S3_Zero_IP
build_flags =
  ${ESP32_S3_Zero_IP.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE --> -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE --> -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE --> -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
build_src_filter = ${ESP32_S3_Zero_IP.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_S3_Zero_IP.lib_deps}
  densaugeo/base64 @ ~1.4.0

; BLE variant -- same reasoning as esp32_s3_zero's own _ble env (separate
; pairing path from USB, in case USB proves unreliable on this board).
[env:ESP32_S3_Zero_comp_radio_ip_ble]
extends = ESP32_S3_Zero_IP
build_flags =
  ${ESP32_S3_Zero_IP.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
; NOTE: DO NOT ENABLE --> -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE --> -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE --> -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
build_src_filter = ${ESP32_S3_Zero_IP.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_S3_Zero_IP.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Dual-interface production build: USB + BLE together -- same convention
; esp32_s3_zero's own _dual env uses.
[env:ESP32_S3_Zero_comp_radio_ip_dual]
extends = ESP32_S3_Zero_IP
build_flags =
  ${ESP32_S3_Zero_IP.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
  -D BLE_PIN_CODE=123456
; NOTE: DO NOT ENABLE --> -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE --> -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE --> -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
build_src_filter = ${ESP32_S3_Zero_IP.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_S3_Zero_IP.lib_deps}
  densaugeo/base64 @ ~1.4.0

; WiFi replaces BLE as the phone-pairing transport -- USB stays too, for
; CLI/tools access (tools/set_ip_params.py etc.), same convention the
; sibling esp32_s3_zero variant's own comp_radio_bridge_espnow_wifi env
; uses. No BLE at all in this env.
;
; WIFI_SSID/WIFI_PWD below are deliberately dummy placeholders, not real
; credentials -- their only job is to compile in SerialWifiInterface (gated
; on #ifdef WIFI_SSID in main.cpp) and its wifi_interface.begin(TCP_PORT)
; phone-pairing server. The actual WiFi STA connection that matters (and
; that IpBridgeRadio's own TLS link rides on) is brought up moments later
; by IP_BRIDGE_RADIO's own runtime-configured wifi.ssid/wifi.pwd block in
; main.cpp (set via CMD_SET_WIFI_PARAMS, same as the USB-only env), which
; simply supersedes this placeholder WiFi.begin() attempt. This keeps WiFi
; credentials fully runtime-configurable -- no real network password is
; ever baked into firmware/source for this env, unlike the ESPNOW_BRIDGE_RADIO
; sibling's own _wifi env (which has no other source of credentials to fall
; back on).
[env:ESP32_S3_Zero_comp_radio_ip_wifi]
extends = ESP32_S3_Zero_IP
build_flags =
  ${ESP32_S3_Zero_IP.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
  -D WIFI_SSID='"placeholder"'
  -D WIFI_PWD='"placeholder"'
; NOTE: DO NOT ENABLE --> -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE --> -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE --> -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
build_src_filter = ${ESP32_S3_Zero_IP.build_src_filter}
  +<helpers/esp32/SerialWifiInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_S3_Zero_IP.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Diagnostic-only build: debug text shares the same USB serial line as the binary
; companion protocol, so a real client (app.meshcore.nz etc.) can't be used at the
; same time as this -- for watching the raw boot log only, not for pairing. Includes
; BLE too, as a second way to observe/reach the device while diagnosing USB issues.
[env:ESP32_S3_Zero_comp_radio_ip_debug]
extends = env:ESP32_S3_Zero_comp_radio_ip
build_flags =
  ${env:ESP32_S3_Zero_comp_radio_ip.build_flags}
  -D BLE_PIN_CODE=123456
  -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
build_src_filter = ${env:ESP32_S3_Zero_comp_radio_ip.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>

; No-LoRa room server, IP-bridge sidecar to a repeater over WiFi (TCP +
; TLS-PSK) -- no ESP-NOW hop needed, same connectivity model as the
; comp_radio_ip companion above, just running simple_room_server instead.
; Real text CLI over USB (unlike the companion, which speaks the binary
; phone-app protocol), so no BLE/WiFi-pairing-transport split needed here --
; USB is always present. Also defines WITH_IP_BRIDGE (in addition to
; IP_BRIDGE_RADIO) purely to activate CommonCLI's already-existing, role-
; agnostic 'wifi.*'/'ip.*' CLI + NodePrefs fields (see CommonCLI.h/.cpp) --
; this board has no IpBridge add-on object of its own, radio_driver IS the
; IP bridge, same as the companion.
[env:ESP32_S3_Zero_room_server_ip]
extends = ESP32_S3_Zero_IP
build_flags =
  ${ESP32_S3_Zero_IP.build_flags}
  -D ADVERT_NAME='"IP Room Server"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D WITH_IP_BRIDGE=1
  ; Passively listens on one public group channel (CLI: 'set room.channel
  ; <name> <psk_base64>'), same as the ESP-NOW room server envs.
  -D WITH_ROOM_CHANNEL_BRIDGE=1
; NOTE: DO NOT ENABLE --> -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE --> -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE --> -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
build_src_filter = ${ESP32_S3_Zero_IP.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
lib_deps =
  ${ESP32_S3_Zero_IP.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Diagnostic-only build: room server has a plain text CLI, so debug logging
; doesn't collide with anything -- same reasoning as the ESP-NOW room
; server's own _debug env.
[env:ESP32_S3_Zero_room_server_ip_debug]
extends = env:ESP32_S3_Zero_room_server_ip
build_flags =
  ${env:ESP32_S3_Zero_room_server_ip.build_flags}
  -D IP_BRIDGE_RADIO_DEBUG_LOGGING=1
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
build_src_filter = ${env:ESP32_S3_Zero_room_server_ip.build_src_filter}
