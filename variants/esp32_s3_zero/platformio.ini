; ----------- Waveshare ESP32-S3-Zero (no LoRa radio, ESP-NOW bridge companion) ------------
;
; Joins an existing MeshCore repeater's ESPNowBridge network (WITH_ESPNOW_BRIDGE) directly,
; using helpers/esp32/ESPNowBridgeRadio.cpp in place of a LoRa radio driver. The repeater's
; firmware is unmodified -- 'bridge.channel'/'bridge.secret' must be set via the CLI to match
; its own settings exactly ('set bridge.channel <1-14>' / 'set bridge.secret <key>'). There is
; no compile-time channel/secret default -- an unconfigured board stays inert (no ESP-NOW peer
; registered) until both are set.

[ESP32_S3_Zero]
extends = esp32_base
board = esp32-s3-zero
board_build.partitions = huge_app.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32_s3_zero
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D PIN_USER_BTN=0
  -D P_LORA_DIO_1=-1
  -D P_LORA_NSS=-1
  ; onboard WS2812 RGB LED (per https://docs.waveshare.com/ESP32-S3-Zero), reused as a
  ; TX indicator via ESP32Board's existing onBeforeTransmit()/onAfterTransmit() hook
  ; (see src/helpers/ESP32Board.h) -- same mechanism LoRa boards use for their TX LED.
  -D P_LORA_TX_NEOPIXEL_LED=21
  -D ESPNOW_BRIDGE_RADIO=1
  ; default Arduino-ESP32 main task stack (8KB) is too small combined with
  ; WiFi/ESP-NOW + BLE + SPIFFS + the companion protocol -- crashes with varying
  ; exception types (LoadProhibited/IllegalInstruction/LoadStoreAlignment) at the
  ; same call site are the signature of stack overflow, not a logic bug. Same fix
  ; already used by variants/lilygo_tlora_v2_1 for a similar reason.
  -D ARDUINO_LOOP_STACK_SIZE=16384
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/esp32/ESPNowBridgeRadio.cpp>
  +<../variants/esp32_s3_zero>

[env:ESP32_S3_Zero_comp_radio_bridge_espnow]
extends = ESP32_S3_Zero
build_flags =
  ${ESP32_S3_Zero.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${ESP32_S3_Zero.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_S3_Zero.lib_deps}
  densaugeo/base64 @ ~1.4.0

; BLE variant: separate pairing path from USB, in case USB proves unreliable on this
; board. Own env (not combined with the USB one) matching this repo's usual pattern
; of one companion interface per build (e.g. Heltec_v3_companion_radio_usb / _ble).
[env:ESP32_S3_Zero_comp_radio_bridge_espnow_ble]
extends = ESP32_S3_Zero
build_flags =
  ${ESP32_S3_Zero.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${ESP32_S3_Zero.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_S3_Zero.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Dual-interface production build: USB + BLE together. Deviates from this repo's
; usual one-interface-per-build convention, but MultiSerialInterface supports it
; natively and it's been proven stable in the _debug env above (same combination,
; just without debug logging here).
[env:ESP32_S3_Zero_comp_radio_bridge_espnow_dual]
extends = ESP32_S3_Zero
build_flags =
  ${ESP32_S3_Zero.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
  -D BLE_PIN_CODE=123456
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${ESP32_S3_Zero.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${ESP32_S3_Zero.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Diagnostic-only build: debug text shares the same USB serial line as the binary
; companion protocol, so a real client (app.meshcore.nz etc.) can't be used at the
; same time as this -- for watching the raw boot log only, not for pairing. Includes
; BLE too, as a second way to observe/reach the device while diagnosing USB issues.
[env:ESP32_S3_Zero_comp_radio_bridge_espnow_debug]
extends = env:ESP32_S3_Zero_comp_radio_bridge_espnow
build_flags =
  ${env:ESP32_S3_Zero_comp_radio_bridge_espnow.build_flags}
  -D BLE_PIN_CODE=123456
  -D ESPNOW_DEBUG_LOGGING=1
  -D MESH_DEBUG=1
build_src_filter = ${env:ESP32_S3_Zero_comp_radio_bridge_espnow.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>

; Repeater build (Phase 0 of planning/ip-bridge-design.md): joins the same
; ESPNowBridge network as the companion envs above, but as a full simple_repeater
; instead of a companion -- proves ESPNowBridgeRadio works in the repeater role
; before adding WiFi STA / IpBridge on top. Follows the same
; simple_repeater-over-ESP-NOW pattern as [env:Generic_ESPNOW_repeatr] in
; variants/generic_espnow/platformio.ini.
[env:ESP32_S3_Zero_repeater_bridge_espnow]
extends = ESP32_S3_Zero
build_flags =
  ${ESP32_S3_Zero.build_flags}
  -D ADVERT_NAME='"ESPNOW Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; distinguishes repeater boards from companion boards at a glance on power-up
  ; (Green(1s)-off(1s)-Green(1s) vs companion's steady single 3s flash)
  -D BOOT_LED_DOUBLE_FLASH=1
  ; UDP+DTLS-PSK point-to-point internet bridge, see planning/ip-bridge-design.md.
  ; Role (hub/spoke) and all connection details (host/port/secret) are runtime-only via
  ; CommonCLI ('set ip.host' etc.) -- nothing here is build-time config.
  -D WITH_IP_BRIDGE=1
  ; ESP-NOW bridge.channel/bridge.secret have no compile-time default (see
  ; src/helpers/esp32/ESPNowBridgeRadio.h) -- set them via the CLI
  ; ('set bridge.channel <1-14>' / 'set bridge.secret <key>') to match whatever
  ; physical repeater this board is meant to join. The board stays inert (no
  ; ESP-NOW peer registered) until both are configured, so a board that hasn't
  ; been set up yet can't silently join the wrong mesh.
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D BRIDGE_DEBUG=1
build_src_filter = ${ESP32_S3_Zero.build_src_filter}
  +<helpers/bridges/IpBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${ESP32_S3_Zero.lib_deps}
  ${esp32_ota.lib_deps}
