; ----------- Seeed XIAO ESP32-S3 (bare board, no Wio-SX1262 daughterboard,
;              no LoRa at all) -- ESP-NOW bridge HOST, not a client/spoke -----------
;
; LOCAL TESTING ONLY, not part of the release asset list. Built to test
; whether a genuinely LoRa-less XIAO S3 (e.g. one of the new "Plus" units
; with a real external antenna) can host the multi-peer ESP-NOW bridge
; network (src/helpers/bridges/ESPNowBridge.cpp, WITH_ESPNOW_BRIDGE) that
; the EchoBoard fleet's real repeater ("EchoGate") normally hosts, instead
; of only being able to join someone else's bridge as a single spoke (that's
; what ESPNOW_BRIDGE_RADIO/ESPNowBridgeRadio -- used by esp32_s3_zero's own
; repeater_bridge_espnow env -- actually is; see ESPNowBridgeRadio.h's own
; doc comment. It tracks exactly one peer MAC and evicts/replaces it on
; every new sender, so it cannot serve as a many-to-many hub for several
; room-server boards at once).
;
; Dispatcher still requires a working mesh::Radio object to drive its own
; TX-completion loop even though no real radio hardware exists here -- see
; src/helpers/esp32/NullRadio.h for why plain ESPNowBridgeRadio couldn't be
; reused for that (it would double-init WiFi/ESP-NOW and fight
; ESPNowBridge's own esp_now_init()/callbacks for the same peripheral).
;
; No IpBridge in this build (unlike EchoGate's real firmware) -- keeps the
; NullRadio stub minimal, since IpBridge.cpp calls several ESPNowBridgeRadio-
; specific LED helper methods (indicateServerMode/setLinkConnected/etc.)
; that a bare-bones stub doesn't implement. Add IpBridge.cpp + those methods
; on NullRadio later if this graduates past local testing.

[Xiao_S3_ESPNow]
extends = esp32_base
board = seeed_xiao_esp32s3
board_check = true
board_build.mcu = esp32s3
board_build.partitions = huge_app.csv
build_flags = ${esp32_base.build_flags}
  -I variants/xiao_s3_espnow
  -D SEEED_XIAO_S3
  -D PIN_VBAT_READ=1   ; D0
  -D PIN_USER_BTN=-1   ; NC
  -D P_LORA_DIO_1=-1   ; no LoRa chip on this board
  -D P_LORA_NSS=-1     ; no LoRa chip on this board
  -D PIN_STATUS_LED=21 ; Orange user led, LOW=On
  -D PIN_BOARD_SDA=D6  ; D6=43
  -D PIN_BOARD_SCL=D7  ; D7=44
  ; default Arduino-ESP32 main task stack (8KB) is too small combined with
  ; WiFi/ESP-NOW + SPIFFS + the ESP-NOW bridge -- same reasoning as
  ; esp32_s3_zero's own ARDUINO_LOOP_STACK_SIZE bump.
  -D ARDUINO_LOOP_STACK_SIZE=16384
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/esp32/NullRadio.cpp>
  +<../variants/xiao_s3_espnow>
lib_deps =
  ${esp32_base.lib_deps}

[env:Xiao_S3_ESPNow_repeater_bridge_espnow]
extends = Xiao_S3_ESPNow
build_src_filter = ${Xiao_S3_ESPNow.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Xiao_S3_ESPNow.build_flags}
  -D ADVERT_NAME='"ESPNow Bridge (Xiao S3, no LoRa)"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${Xiao_S3_ESPNow.lib_deps}
  ${esp32_ota.lib_deps}
