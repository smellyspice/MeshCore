; ----------- Waveshare ESP32-S3-Zero (no LoRa radio) -- combined ESP-NOW
;              bridge HOST (for a local no-LoRa fleet) + IP bridge CLIENT
;              (for reaching a main repeater over WiFi/IP instead of LoRa) -----------
;
; This is the "LoRa-less gateway repeater" role: hosts the multi-peer
; ESPNowBridge network (src/helpers/bridges/ESPNowBridge.cpp, same class a
; real repeater like EchoGate uses) that a local fleet of no-LoRa
; room-servers/companions joins, while itself reaching the wider mesh's main
; repeater over WiFi/IP via IpBridge (src/helpers/bridges/IpBridge.cpp) as a
; client, instead of a LoRa RF hop.
;
; Deliberately NOT the esp32_s3_zero variant's own ESPNOW_BRIDGE_RADIO
; mechanism -- that's a single-peer CLIENT (joins someone else's bridge as
; one spoke, see ESPNowBridgeRadio.h's own doc comment) and cannot host
; multiple peers at once, which is the whole point of this role. Uses
; NullRadio (src/helpers/esp32/NullRadio.h) purely to satisfy Dispatcher's
; generic radio contract, since there's no real LoRa hardware and
; ESPNowBridge does its own independent WiFi/ESP-NOW init.
;
; wifi.ssid/wifi.pwd and ip.host/ip.port/ip.secret are runtime-only via
; CommonCLI ('set wifi.ssid <ssid>' etc.) -- nothing WiFi/IP-related here is
; build-time config. bridge.channel/bridge.secret (for the local ESP-NOW
; fleet) are likewise runtime-only.

[ESP32_S3_Zero_ESPNow_Host]
extends = esp32_base
board = esp32-s3-zero
board_build.partitions = huge_app.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32_s3_zero_espnow_host
  ; Same convention as the sibling esp32_s3_zero variant -- this board runs
  ; WiFi + ESP-NOW + two bridges continuously with no LoRa timing to
  ; protect, so the same 80MHz de-rate applies for heat/power (no BLE envs
  ; defined in this particular variant, so no BLE-coexistence caveat here).
  -D ESP32_CPU_FREQ=80
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D PIN_USER_BTN=0
  -D P_LORA_DIO_1=-1
  -D P_LORA_NSS=-1
  ; onboard WS2812 RGB LED (per https://docs.waveshare.com/ESP32-S3-Zero) --
  ; ESP32Board's onBeforeTransmit()/onAfterTransmit() hook still fires (see
  ; src/helpers/ESP32Board.h) even with NullRadio, since that hook lives on
  ; `board`, not the radio driver.
  -D P_LORA_TX_NEOPIXEL_LED=21
  ; default Arduino-ESP32 main task stack (8KB) is too small combined with
  ; WiFi STA + ESP-NOW + BLE-less SPIFFS + two bridges -- same reasoning as
  ; esp32_s3_zero's own ARDUINO_LOOP_STACK_SIZE bump.
  -D ARDUINO_LOOP_STACK_SIZE=16384
  ; Tells IpBridge.cpp that NullRadio (not ESPNowBridgeRadio) is this board's
  ; LED-capable radio_driver -- see the guard block at the top of
  ; IpBridge.cpp. Without this, IpBridge's connect/disconnect/ping/pong LED
  ; indicators are silently compiled out.
  -D NULLRADIO_STATUS_LED=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/esp32/NullRadio.cpp>
  +<../variants/esp32_s3_zero_espnow_host>

[env:ESP32_S3_Zero_espnow_host_ip_gateway]
extends = ESP32_S3_Zero_ESPNow_Host
build_flags =
  ${ESP32_S3_Zero_ESPNow_Host.build_flags}
  -D ADVERT_NAME='"ESPNow+IP Gateway"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
  -D WITH_IP_BRIDGE=1
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
; NOTE: DO NOT ENABLE -->  -D ESPNOW_DEBUG_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D BRIDGE_DEBUG=1
build_src_filter = ${ESP32_S3_Zero_ESPNow_Host.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<helpers/bridges/IpBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${ESP32_S3_Zero_ESPNow_Host.lib_deps}
  ${esp32_ota.lib_deps}

[env:ESP32_S3_Zero_espnow_host_ip_gateway_debug]
extends = env:ESP32_S3_Zero_espnow_host_ip_gateway
build_flags =
  ${env:ESP32_S3_Zero_espnow_host_ip_gateway.build_flags}
  -D BRIDGE_DEBUG=1
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
  -D ESPNOW_DEBUG_LOGGING=1
  -D WIFI_DEBUG_LOGGING=1
